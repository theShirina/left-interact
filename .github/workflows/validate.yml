name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.1

      - name: Validate addon
        run: |
          python scripts/validate.py
          luac5.1 -p LeftInteract.lua

      - name: Build release package
        run: python scripts/build_release.py

      - name: Test release archive
        run: unzip -t dist/LeftInteract-v*.zip

      - name: Upload release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LeftInteract
          path: |
            dist/*.zip
            dist/*.sha256
