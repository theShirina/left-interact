name: Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes lua5.1

      - name: Validate addon
        run: python scripts/validate.py

      - name: Compile with Lua 5.1
        run: luac5.1 -p LeftInteract.lua

      - name: Test movement defaults
        run: |
          lua5.1 tests/test_defaults.lua new
          lua5.1 tests/test_defaults.lua existing-independent
          lua5.1 tests/test_defaults.lua existing-independent-without-enabled
          lua5.1 tests/test_defaults.lua existing-combined
          lua5.1 tests/test_defaults.lua item-native-dispatch
          lua5.1 tests/test_defaults.lua changelog-page

      - name: Build release package
        run: python scripts/build_release.py

      - name: Test release archive
        run: unzip -t dist/LeftInteract-v*.zip

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LeftInteract
          path: |
            dist/*.zip
            dist/*.sha256
